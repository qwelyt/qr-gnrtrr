<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>QR-GNRTR</title>
		<link rel="stylesheet" href="./style.css">
		<script type="module" src="./script.js"></script>
	</head>
	<body>
		<header>
		</header>
		<main>
			<input id="qr-content" type="text" placeholder="Type here">
			<div>
				<input id="qr-logo" type="file" accept="image/*">
				<input id="qr-remove-logo" type="button" value="&#128465;">
				<div>
					<label for="qr-logo-size">Logo size</label>
					<input id="qr-logo-size" type="range" min="5" max="30" value="20">
					<output id="qr-logo-size-value">20</output>
					<div>
						<form id="qr-logo-bg-shape">
							<fieldset>
								<span>
									<input type="radio" name="qr-logo-background-shape" id="qr-logo-bg-shape1" value="square" checked />
									<label for="qr-logo-bg-shape1">Square</label>
								</span>
								<span>
									<input type="radio" name="qr-logo-background-shape" id="qr-logo-bg-shape2" value="circle" />
									<label for="qr-logo-bg-shape2">Circle</label>
								</span>
								<span>
									<input type="radio" name="qr-logo-background-shape" id="qr-logo-bg-shape3" value="rounded-square" />
									<label for="qr-logo-bg-shape3">Rounded square</label>
								</span>
								<span>
									<input type="radio" name="qr-logo-background-shape" id="qr-logo-bg-shape4" value="none" />
									<label for="qr-logo-bg-shape4">None</label>
								</span>
							</fieldset>
						</form>
					</div>

				</div>
			</div>
			<div>
				<div>
					<label for="qr-border-width">Border width</label>
					<input id="qr-border-width" type="range" min="0" max="20" value="1">
					<output id="qr-border-width-value">1</output>
				</div>
				<div>
					<label for="qr-border-radius">Border radius</label>
					<input id="qr-border-radius" type="range" min="0" max="20" value="3">
					<output id="qr-border-radius-value">3</output>
				</div>
			</div>
			<a id="qr-download" download="qr-code.svg">&#128190; SVG</a>
			<div id="qr-code"></div>
		</main>
		<footer>
		</footer>
	</body>
</html>
